[project]
name = "vital-mcp"
version = "0.2.1"
description = "MCP server for designing and editing Vital synth presets"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3",
    "numpy>=1.24",
]

[project.optional-dependencies]
render = ["dawdreamer>=0.8"]

[project.scripts]
vital-mcp = "vital_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vital_mcp"]
